# Local development and the demo only. Credentials below are throwaway defaults for local containers.
# `make db-up` starts Postgres alone (tests); `make up` adds migrations, the fake provider and the integration.
x-django-env: &django-env
  DATABASE_URL: postgres://${POSTGRES_USER:-risk}:${POSTGRES_PASSWORD:-risk}@db:5432/${POSTGRES_DB:-risk}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk}
      POSTGRES_DB: ${POSTGRES_DB:-risk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The release pipeline's job in production: the integration never migrates, its startup probe waits.
  migrate:
    profiles: ["app"]
    build: { context: ., target: app }
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *django-env
    depends_on:
      db: { condition: service_healthy }

  fake-provider:
    profiles: ["app"]
    build: { context: ., target: fake-provider }
    environment:
      FAKE_PROVIDER_TOKEN: ${RISK_PROVIDER_TOKEN:-dev-token}
      FAKE_PROVIDER_REPLY: ${FAKE_PROVIDER_REPLY:-ACCEPT}
    ports:
      - "8765:8765"

  app:
    profiles: ["app"]
    build: { context: ., target: app }
    depends_on:
      migrate: { condition: service_completed_successfully }
      fake-provider: { condition: service_started }
    environment:
      <<: *django-env
      DATABASE_CONN_MAX_AGE: "60"
      RISK_PROVIDER_URL: ws://fake-provider:8765
      RISK_PROVIDER_ALLOW_PLAINTEXT: "1"
      RISK_PROVIDER_TOKEN: ${RISK_PROVIDER_TOKEN:-dev-token}
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Above the drain budget plus the session close, as terminationGracePeriodSeconds in Kubernetes.
    stop_grace_period: 30s

volumes:
  pgdata:
